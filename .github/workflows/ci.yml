name: Application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: hof_test
          POSTGRES_USER: hof
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hof -d hof_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: hof_test
      DB_USERNAME: hof
      DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.26'
          extensions: pdo_pgsql, mbstring, intl, bcmath, zip
          coverage: none
      - run: cp .env.example .env
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: vendor/bin/pint --test
      - run: php artisan test
  deployment-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: hof-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: tools/browser/package-lock.json
      - name: Create disposable test configuration
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=testing/; s|^APP_URL=.*|APP_URL=http://127.0.0.1:8080|' .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=$(openssl rand -hex 24)/" .env
      - name: Build both production image targets
        run: |
          docker compose config --quiet
          docker compose build app web scheduler
      - name: Generate key, migrate, bootstrap and start
        run: |
          key=$(docker compose run --rm --no-deps app php artisan key:generate --show)
          test -n "$key"
          sed -i "s|^APP_KEY=.*|APP_KEY=$key|" .env
          docker compose up -d --wait db
          docker compose run --rm app php artisan migrate --force
          docker compose run --rm app php artisan game:maintain --bootstrap
          docker compose up -d app web
          curl --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 http://127.0.0.1:8080/up
      - name: Check application and scheduler
        run: |
          docker compose exec -T app php artisan migrate:status
          docker compose exec -T app php artisan schedule:list
          docker compose exec -T app php artisan schedule:run --verbose | tee /tmp/hof-scheduler.log
          grep -q 'game:maintain' /tmp/hof-scheduler.log
          grep -q 'DONE' /tmp/hof-scheduler.log
          docker compose up -d scheduler
          test "$(docker inspect --format '{{.State.Running}}' "$(docker compose ps -q scheduler)")" = true
      - name: Install isolated browser test dependencies
        working-directory: tools/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Exercise browser flow and capture screenshots
        working-directory: tools/browser
        run: npm test
      - name: Verify database backup and restore into a separate disposable database
        run: bash tools/browser/backup-smoke.sh
      - name: Save container diagnostics
        if: always()
        run: |
          mkdir -p tools/browser/screenshots
          docker compose ps --all > tools/browser/screenshots/compose-status.txt
          docker compose logs --no-color > tools/browser/screenshots/compose.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: deployment-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: tools/browser/screenshots/
          retention-days: 7
      - name: Tear down disposable services, volumes and configuration
        if: always()
        run: |
          trap 'rm -f .env' EXIT
          docker compose down --volumes --remove-orphans

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: hof
      POSTGRES_USER: hof
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hof -d hof"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - app
    restart: unless-stopped
  scheduler:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres:

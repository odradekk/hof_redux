# 自动测试实例 hof-test：固定构建镜像，供自动检查（构建/迁移/健康/重启持久性）使用。
# 入口：http://127.0.0.1:62000  数据：../var/test/db  备份目标：../var/test/backup
name: hof-test

services:
  backend:
    build:
      context: ..
      dockerfile: docker/app/backend.Dockerfile
      # 本机代理由 TUN 透明代理提供，容器桥接网络不经过 TUN；构建期使用宿主网络取得外网。
      network: host
    image: hof-backend:local
    user: "${HOF_RUN_USER:?请经 scripts/instance.sh 启动（生成 var/instance.env 提供运行用户 uid:gid）}"
    environment:
      HOF_DB_PATH: /var/lib/hof/db/hof.sqlite
      HOF_TRUST_PROXY: "true"
    volumes:
      - ../var/test/db:/var/lib/hof/db
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/app/web.Dockerfile
      network: host
    image: hof-web:local
    ports:
      - "127.0.0.1:62000:80"
    depends_on:
      - backend
    restart: unless-stopped

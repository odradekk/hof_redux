; 旧版 HOF 本地参照栈专用 php 配置（dev only）。
; PHP4 构造器在 7.4 下仅报 E_DEPRECATED，按已确认决定排除该级别以保持日志可读；
; Fatal / Warning 仍记录，用于验收。
; display_errors 必须 Off：旧文件带 BOM（include 时即输出），错误回显进 HTML 会
; 导致 session_* headers-sent 连锁警告，并污染 image.php 的二进制图片输出。
; output_buffering 兜住 include 阶段的 BOM 字节，保证 session 正常启动。
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
default_charset = UTF-8
output_buffering = 4096
